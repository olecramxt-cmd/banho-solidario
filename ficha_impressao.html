<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMAS iPeC - Impressão Direta / Banho Solidário</title>
    <link rel="icon" type="image/png" href="imagens/Logo para icones.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 0; }
        /* 🟢 Oculta totalmente qualquer elemento visual na tela para o usuário */
        #fichaImpressaoArea { display: none !important; }
        .navbar, .container, .side-menu, .menu-overlay { display: none !important; }
    </style>
</head>
<body onload="inicializarImpressaoInvisivel()">

    <script src="config.js"></script>
    <script>
        const autorizado = sessionStorage.getItem('pbs_autorizado') === 'true';
        const ativoLocal = localStorage.getItem('usuario_ativo');
        if (!autorizado && !ativoLocal) {
            window.location.href = 'login.html';
        }
    </script>

    <!-- Estrutura oculta apenas para manter a integridade do DOM caso precise popular -->
    <div id="fichaImpressaoArea">
        <div id="lblNomeFicha"></div>
        <div id="lblMatriculaFicha"></div>
        <div id="lblDataCadFicha"></div>
        <div id="lblStatusFicha"></div>
        <div id="avatarFichaContainer"></div>
        <div id="fNomeComp"></div>
        <div id="fSocial"></div>
        <div id="fNasc"></div>
        <div id="fIdade"></div>
        <div id="fSexo"></div>
        <div id="fEscolaridade"></div>
        <div id="fNaturalidade"></div>
        <div id="fRg"></div>
        <div id="fCpf"></div>
        <div id="fCartaoSus"></div>
        <div id="fCorRaca"></div>
        <div id="fMae"></div>
        <div id="fPai"></div>
        <div id="fEndereco"></div>
        <div id="fCidade"></div>
        <div id="fTelefone"></div>
        <div id="fResidenciaUnai"></div>
        <div id="fTipoUsuario"></div>
        <div id="fTempoRua"></div>
        <div id="fTempoUnai"></div>
        <div id="fMotivos"></div>
        <div id="fOutrosMotivos"></div>
        <div id="fPassouAtend"></div>
        <div id="fRecebeAuxilio"></div>
        <div id="fQualBeneficio"></div>
        <div id="fPossuiDocs"></div>
        <div id="fDocsFaltam"></div>
        <div id="fCarteiraTrabalho"></div>
        <div id="fObservacoes"></div>
        <div id="fOperador"></div>
    </div>

    <script>
        function inicializarImpressaoInvisivel() {
            const assistidoSalvo = localStorage.getItem('assistido_imprimir');
            if (assistidoSalvo) {
                try {
                    const reg = JSON.parse(assistidoSalvo);
                    localStorage.removeItem('assistido_imprimir');
                    
                    // Preenche silenciosamente (necessário para o motor de impressão compilar o documento)
                    popularDados Invisivel(reg);

                    // Configura o retorno automático para a Galeria assim que a impressão fechar ou concluir
                    window.onafterprint = function() {
                        window.location.href = 'galeria.html';
                    };

                    // Fallback de segurança para navegadores móveis que fecham a janela ou perdem o foco
                    window.onfocus = function() {
                        setTimeout(function() {
                            window.location.href = 'galeria.html';
                        }, 500);
                    };

                    // Dispara a impressão imediatamente após um breve instante para montagem
                    setTimeout(function() {
                        window.print();
                    }, 400);

                } catch(e) {
                    console.error("Erro na impressão direta:", e);
                    window.location.href = 'galeria.html';
                }
            } else {
                window.location.href = 'galeria.html';
            }
        }

        function popularDadosInvisivel(reg) {
            // Função de população interna para garantir que o documento existe caso o navegador exija
            const nomeComp = reg.nomeCompleto || reg.nome || "Não informado";
            const matricula = reg.matricula || reg.mat || "---";
            const operador = reg.operador || reg.usuario || "Sistema";
            
            if(document.getElementById('lblNomeFicha')) document.getElementById('lblNomeFicha').innerText = nomeComp;
            if(document.getElementById('lblMatriculaFicha')) document.getElementById('lblMatriculaFicha').innerText = "Matrícula: " + matricula;
            if(document.getElementById('fNomeComp')) document.getElementById('fNomeComp').innerText = nomeComp;
            if(document.getElementById('fCpf')) document.getElementById('fCpf').innerText = reg.cpf || "---";
            if(document.getElementById('fOperador')) document.getElementById('fOperador').innerText = operador;
        }
    </script>
</body>
</html>
