    <script>
        const autorizado = sessionStorage.getItem('pbs_autorizado') === 'true';
        const ativoLocal = localStorage.getItem('usuario_ativo');
        const sessionAutorizado = sessionStorage.getItem('pbs_usuario_nome');

        if (!autorizado && !ativoLocal && !sessionAutorizado) {
            sessionStorage.setItem('pbs_destino', window.location.pathname.split('/').pop());
            window.location.href = 'login.html';
        }

        let operadorLogado = "Voluntário / Operador"; 
        try {
            if (ativoLocal) {
                try {
                    const objUser = JSON.parse(ativoLocal);
                    operadorLogado = objUser.nome || objUser.username || ativoLocal;
                } catch(parseErr) {
                    operadorLogado = ativoLocal;
                }
            } else if (sessionAutorizado) {
                operadorLogado = sessionAutorizado;
            } else {
                for (let i = 0; i < sessionStorage.length; i++) {
                    let key = sessionStorage.key(i);
                    if (key.includes('usuario') || key.includes('nome') || key.includes('operador')) {
                        let val = sessionStorage.getItem(key);
                        if (val && val.length < 50) { operadorLogado = val; break; }
                    }
                }
            }
        } catch(e) {
            operadorLogado = "Voluntário / Operador";
        }

        const API_URL = (typeof CONFIG !== 'undefined' && CONFIG.API_URL) ? CONFIG.API_URL : "";
    </script>
