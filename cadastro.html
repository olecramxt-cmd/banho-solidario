<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem e Recepção - Banho Solidário</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0ea5e9;
            --secondary-color: #7c3aed;
            --accent-color: #e0f2fe;
            --dark-color: #1f2937;
            --light-color: #f8fafc;
            --text-color: #4b5563;
            --border-color: #cbd5e1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: var(--light-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header-content h1 {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }
        .header-content p {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.95;
        }
        .btn-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 6px 14px;
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .btn-voltar:hover {
            background-color: white;
            color: var(--secondary-color);
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .form-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }
        h2 {
            color: var(--secondary-color);
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--dark-color);
        }
        input[type="text"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-color);
            background: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.3rem;
        }
        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-color);
        }
        .section-subtitle {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--dark-color);
            margin: 1.5rem 0 0.8rem 0;
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.3s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        footer {
            text-align: center;
            padding: 2rem;
            background: var(--dark-color);
            color: white;
            font-size: 0.9rem;
        }
        footer a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="./index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao Site</a>
        <div class="header-content">
            <h1><i class="fa-solid fa-clipboard-user"></i> Triagem e Recepção</h1>
            <p>Sistema de Cadastro e Controle - Projeto Banho Solidário</p>
        </div>
    </header>

    <div class="container">
        <form id="formTriagem" class="form-card" onsubmit="salvarCadastroTriagem(event)">
            
            <!-- 1. TRIAGEM - RECEPÇÃO -->
            <h2><i class="fa-solid fa-user-pen"></i> Triagem - Recepção</h2>
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="nomeCompleto">Nome Completo:</label>
                    <input type="text" id="nomeCompleto" required placeholder="Digite o nome completo">
                </div>

                <div class="form-group full-width">
                    <label for="nomeSocial">Nome Social:</label>
                    <input type="text" id="nomeSocial" placeholder="Digite o nome social (se houver)">
                </div>

                <div class="form-group">
                    <label for="dataNascimento">Data de Nascimento:</label>
                    <input type="date" id="dataNascimento">
                </div>

                <div class="form-group">
                    <label for="idade">Idade:</label>
                    <input type="text" id="idade" placeholder="Ex: 35 anos">
                </div>

                <div class="form-group">
                    <label>Sexo:</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="sexo" value="F"> F</label>
                        <label class="radio-label"><input type="radio" name="sexo" value="M"> M</label>
                        <label class="radio-label"><input type="radio" name="sexo" value="Não declarado"> Não declarado</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="escolaridade">Escolaridade:</label>
                    <input type="text" id="escolaridade" placeholder="Ex: Ensino Fundamental Incompleto">
                </div>

                <div class="form-group">
                    <label for="naturalidade">Naturalidade:</label>
                    <input type="text" id="naturalidade" placeholder="Cidade/Estado">
                </div>

                <div class="form-group">
                    <label for="rg">RG:</label>
                    <input type="text" id="rg" placeholder="Número do RG">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF (Opcional caso não possua):</label>
                    <input type="text" id="cpf" placeholder="Número do CPF">
                </div>

                <div class="form-group">
                    <label for="corRaca">Cor / Raça:</label>
                    <input type="text" id="corRaca" placeholder="Ex: Pardo, Branco, Preto">
                </div>

                <div class="form-group full-width">
                    <label for="filiacaoMae">Filiação (Mãe):</label>
                    <input type="text" id="filiacaoMae" placeholder="Nome da mãe">
                </div>

                <div class="form-group full-width">
                    <label for="filiacaoPai">Filiação (Pai):</label>
                    <input type="text" id="filiacaoPai" placeholder="Nome do pai">
                </div>

                <div class="form-group full-width">
                    <label for="endereco">Endereço (ou Ponto de Referência se em situação de rua):</label>
                    <input type="text" id="endereco" placeholder="Endereço atual">
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" value="Unaí-MG">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / Contato:</label>
                    <input type="tel" id="telefone" placeholder="(38) 90000-0000">
                </div>
            </div>

            <!-- 2. ATENDIMENTO TÉCNICO -->
            <h2 style="margin-top: 2rem;"><i class="fa-solid fa-stethoscope"></i> Atendimento Técnico</h2>

            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Possui residência ou familiares em Unaí?</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="residenciaUnaí" value="Não"> Não</label>
                        <label class="radio-label"><input type="radio" name="residenciaUnaí" value="Sim"> Sim</label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Tipo de usuário:</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="tipoUsuario" value="Idoso"> Idoso</label>
                        <label class="radio-label"><input type="radio" name="tipoUsuario" value="Adulto"> Adulto</label>
                        <label class="radio-label"><input type="radio" name="tipoUsuario" value="Criança/Adolescente"> Criança/Adolescente</label>
                        <label class="radio-label"><input type="radio" name="tipoUsuario" value="Pessoa com deficiência"> Pessoa com deficiência</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="section-subtitle" style="margin-top:0;">Tempo de Permanência na rua:</label>
                    <div class="radio-group" style="flex-direction: column; gap: 0.5rem;">
                        <label class="radio-label"><input type="radio" name="tempoRua" value="Até 30 dias"> Até 30 dias</label>
                        <label class="radio-label"><input type="radio" name="tempoRua" value="30 à 90 dias"> 30 à 90 dias</label>
                        <label class="radio-label"><input type="radio" name="tempoRua" value="90 até 01 ano"> 90 até 01 ano</label>
                        <label class="radio-label"><input type="radio" name="tempoRua" value="01 ano ou mais"> 01 ano ou mais</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="section-subtitle" style="margin-top:0;">Tempo de permanência em Unaí:</label>
                    <div class="radio-group" style="flex-direction: column; gap: 0.5rem;">
                        <label class="radio-label"><input type="radio" name="tempoUnaí" value="Até 30 dias"> Até 30 dias</label>
                        <label class="radio-label"><input type="radio" name="tempoUnaí" value="30 à 90 dias"> 30 à 90 dias</label>
                        <label class="radio-label"><input type="radio" name="tempoUnaí" value="01 ano ou mais"> 01 ano ou mais</label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label class="section-subtitle">Principais motivos dessa permanência:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label"><input type="checkbox" name="motivosPermanencia" value="Alcoolismo e/ou drogas"> Alcoolismo e/ou drogas</label>
                        <label class="checkbox-label"><input type="checkbox" name="motivosPermanencia" value="Conflitos Familiares"> Conflitos Familiares</label>
                        <label class="checkbox-label"><input type="checkbox" name="motivosPermanencia" value="Separação Conjugal"> Separação Conjugal</label>
                        <label class="checkbox-label"><input type="checkbox" name="motivosPermanencia" value="Desemprego"> Desemprego</label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="outrosMotivos">Outros motivos:</label>
                    <input type="text" id="outrosMotivos" placeholder="Especifique se houver outro motivo">
                </div>

                <div class="form-group full-width">
                    <label class="section-subtitle">Já passou por atendimento:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label"><input type="checkbox" name="passouAtendimento" value="CAPS"> CAPS</label>
                        <label class="checkbox-label"><input type="checkbox" name="passouAtendimento" value="CAPS AD"> CAPS AD</label>
                        <label class="checkbox-label"><input type="checkbox" name="passouAtendimento" value="Clínica de recuperação"> Clínica de recuperação</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Recebe auxílio benefício?</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="recebeAuxilio" value="Sim"> Sim</label>
                        <label class="radio-label"><input type="radio" name="recebeAuxilio" value="Não"> Não</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="qualBeneficio">Qual benefício?</label>
                    <input type="text" id="qualBeneficio" placeholder="Ex: Bolsa Família, BPC...">
                </div>

                <div class="form-group">
                    <label>Possui todos os documentos?</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="possuiDocumentos" value="Sim"> Sim</label>
                        <label class="radio-label"><input type="radio" name="possuiDocumentos" value="Não"> Não</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="documentosFaltam">Quais documentos faltam?</label>
                    <input type="text" id="documentosFaltam" placeholder="Ex: CPF, RG, Certidão...">
                </div>

                <div class="form-group full-width">
                    <label>Possui carteira de trabalho?</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="carteiraTrabalho" value="Sim"> Sim</label>
                        <label class="radio-label"><input type="radio" name="carteiraTrabalho" value="Não"> Não</label>
                    </div>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn-submit" id="btnSalvar">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Cadastro de Triagem
                </button>
            </div>

        </form>
    </div>

    <footer>
        <p>&copy; 2026 Projeto Banho Solidário - Unaí-MG.</p>
        <p><small>© <a href="mailto:olecramxt@gmail.com">Prof. Esp. Marcelo Xavier Travassos</a> - SISTEMAS iPeC.</small></p>
    </footer>

    <!-- Script de Integração com a Nuvem (Google Apps Script) -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbydEGtKeZZAmxNqM26-2JDZb9DtMl5loLF4BPjusmhVIEFeTTxt3DKVX8-sBHYwFzsZ/exec";

        function getRadioVal(name) {
            const el = document.querySelector(`input[name="${name}"]:checked`);
            return el ? el.value : '';
        }

        function getCheckboxesVal(name) {
            const els = document.querySelectorAll(`input[name="${name}"]:checked`);
            let valores = [];
            els.forEach(e => valores.push(e.value));
            return valores.join(', ');
        }

        async function salvarCadastroTriagem(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando na nuvem...';

            const dadosTriagem = {
                action: 'salvarTriagem',
                nomeCompleto: document.getElementById('nomeCompleto').value.trim(),
                nomeSocial: document.getElementById('nomeSocial').value.trim(),
                dataNascimento: document.getElementById('dataNascimento').value,
                idade: document.getElementById('idade').value.trim(),
                sexo: getRadioVal('sexo'),
                escolaridade: document.getElementById('escolaridade').value.trim(),
                naturalidade: document.getElementById('naturalidade').value.trim(),
                rg: document.getElementById('rg').value.trim(),
                cpf: document.getElementById('cpf').value.trim(),
                corRaca: document.getElementById('corRaca').value.trim(),
                filiacaoMae: document.getElementById('filiacaoMae').value.trim(),
                filiacaoPai: document.getElementById('filiacaoPai').value.trim(),
                endereco: document.getElementById('endereco').value.trim(),
                cidade: document.getElementById('cidade').value.trim(),
                telefone: document.getElementById('telefone').value.trim(),
                residenciaUnaí: getRadioVal('residenciaUnaí'),
                tipoUsuario: getRadioVal('tipoUsuario'),
                tempoRua: getRadioVal('tempoRua'),
                tempoUnaí: getRadioVal('tempoUnaí'),
                motivosPermanencia: getCheckboxesVal('motivosPermanencia'),
                outrosMotivos: document.getElementById('outrosMotivos').value.trim(),
                passouAtendimento: getCheckboxesVal('passouAtendimento'),
                recebeAuxilio: getRadioVal('recebeAuxilio'),
                qualBeneficio: document.getElementById('qualBeneficio').value.trim(),
                possuiDocumentos: getRadioVal('possuiDocumentos'),
                documentosFaltam: document.getElementById('documentosFaltam').value.trim(),
                carteiraTrabalho: getRadioVal('carteiraTrabalho')
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(dadosTriagem)
                });
                const resultado = await response.json();

                if (resultado.status === "sucesso") {
                    alert('Cadastro salvo com sucesso! Matrícula gerada: ' + resultado.matricula);
                    document.getElementById('formTriagem').reset();
                } else if (resultado.status === "duplicado") {
                    alert(resultado.message);
                } else {
                    alert('Erro ao salvar no servidor em nuvem.');
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro de conexão com a nuvem do Google.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salvar Cadastro de Triagem';
            }
        }
    </script>

</body>
</html>
