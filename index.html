<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMAS iPeC - Projeto Banho Solidário</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* Menu Sanduíche Estilizado */
        .navbar {
            background-color: #0f172a;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background-color: #1e293b;
            box-shadow: 4px 0 10px rgba(0,0,0,0.3);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            overflow-y: auto;
        }

        .side-menu.open {
            left: 0;
        }

        .side-menu h3 {
            border-bottom: 1px solid #475569;
            padding-bottom: 10px;
            margin-top: 0;
            color: #38bdf8;
            font-size: 18px;
        }

        .side-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .side-menu li {
            margin: 12px 0;
            font-weight: 600;
        }

        .side-menu li ul {
            padding-left: 15px;
            margin-top: 5px;
        }

        .side-menu li ul li {
            font-weight: normal;
            font-size: 14px;
            color: #94a3b8;
            margin: 8px 0;
        }

        .side-menu a {
            color: #e2e8f0;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }

        .side-menu a:hover {
            color: #38bdf8;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('imagens/banner.jpg') no-repeat center center;
            background-size: cover;
            color: white;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Menu Sanduíche -->
    <div class="navbar">
        <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
        <span style="font-weight: bold; font-size: 18px;">SISTEMAS iPeC - Banho Solidário</span>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="side-menu" id="sideMenu">
        <h3>MENU DO SISTEMA</h3>
        <ul>
            <li>
                1. Voluntários
                <ul>
                    <li><a href="#">1.1- Consulta</a></li>
                </ul>
            </li>
            <li>
                2. Assistidos (Área Restrita)
                <ul>
                    <li><a href="consulta.html">2.1- Consulta</a></li>
                </ul>
            </li>
            <li><a href="#">3. Painel Administrativo</a></li>
            <li><a href="#" target="_blank">4. Sobre (Acessar E-book)</a></li>
        </ul>
    </div>

    <!-- Conteúdo Principal / Hero -->
    <div class="hero">
        <h1>Projeto Banho Solidário</h1>
        <p>Cada gota, um ato de amor! Mais que um banho, um novo começo.</p>
    </div>

    <script>
        /* © Prof. Esp. Marcelo Xavier Travassos - SISTEMAS iPeC. */
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
