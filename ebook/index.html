<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Banho Solidário - Unaí-MG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f9fc;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #0077b6;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #555555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-ebook {
            background-color: #0077b6;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 119, 182, 0.3);
            display: inline-block;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-ebook:hover {
            background-color: #023e8a;
            transform: translateY(-2px);
        }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Projeto Banho Solidário</h1>
        <p>Restaurando a dignidade, a higiene e a esperança através do cuidado humanizado em Unaí-MG.</p>
        
        <!-- Botão de Acesso Direto ao E-book -->
        <a href="./ebook/" target="_blank" class="btn-ebook">
            📖 Acessar E-book Interativo
        </a>

        <footer>
            <p>© Prof. Esp. Marcelo Xavier Travassos - SISTEMAS iPeC</p>
        </footer>
    </div>

</body>
</html>
