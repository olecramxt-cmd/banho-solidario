<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>© Prof. Esp. Marcelo Xavier Travassos - SISTEMAS iPeC - Login / Banho Solidário</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --danger-color: #dc2626;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: var(--primary-dark);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-login {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background-color: var(--primary-dark);
        }
        #msgErro {
            color: var(--danger-color);
            font-size: 14px;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>SISTEMAS iPeC</h2>
        <p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">Projeto Banho Solidário - Área Restrita</p>
        
        <div class="form-group">
            <label>Usuário / E-mail Autorizado</label>
            <input type="text" id="usuario" placeholder="Digite o usuário...">
        </div>
        <div class="form-group">
            <label>Senha de Acesso</label>
            <input type="password" id="senha" placeholder="Digite a senha..." onkeypress="if(event.key === 'Enter') realizarLogin()">
        </div>
        
        <button class="btn-login" onclick="realizarLogin()">Entrar no Sistema</button>
        <div id="msgErro"></div>
    </div>

    <script>
        function realizarLogin() {
            var user = document.getElementById('usuario').value.trim();
            var pass = document.getElementById('senha').value.trim();
            
            if (user === 'projbsolidario@gmail.com' && pass === 'pbs2026') {
                sessionStorage.setItem('pbs_autorizado', 'true');
                window.location.href = 'cadastro.html';
            } else {
                document.getElementById('msgErro').innerText = 'Usuário ou senha inválidos!';
            }
        }
    </script>
</body>
</html>
