<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>© Prof. Esp. Marcelo Xavier Travassos - SISTEMAS iPeC - Login / Banho Solidário</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --danger-color: #dc2626;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: var(--primary-dark);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-login {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background-color: var(--primary-dark);
        }
        #msgErro {
            color: var(--danger-color);
            font-size: 14px;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>SISTEMAS iPeC</h2>
        <p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">Projeto Banho Solidário - Área Restrita</p>
        
        <div class="form-group">
            <label>Usuário (Username)</label>
            <input type="text" id="usuario" placeholder="Ex: marcelo">
        </div>
        <div class="form-group">
            <label>Senha de Acesso</label>
            <input type="password" id="senha" placeholder="Digite sua senha..." onkeypress="if(event.key === 'Enter') realizarLogin()">
        </div>
        
        <button class="btn-login" onclick="realizarLogin()">Entrar no Sistema</button>
        <div id="msgErro"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw61tX1IbdwUSVVJ28zkdxRDGcsZvUGiNuTX18_ow3gSj9pzNVzeqNoWBiLrHYsjunH_Q/exec";

        function realizarLogin() {
            var user = document.getElementById('usuario').value.trim().toLowerCase();
            var pass = document.getElementById('senha').value.trim();
            var msgDiv = document.getElementById('msgErro');

            if (!user || !pass) {
                msgDiv.innerText = 'Preencha o usuário e a senha!';
                return;
            }

            msgDiv.style.color = '#0284c7';
            msgDiv.innerText = 'A validar acesso na nuvem...';

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'loginUsuario',
                    username: user,
                    senha: pass
                })
            })
            .then(res => res.json())
            .then(resposta => {
                if (resposta.status === 'sucesso') {
                    // Gravação unificada para compatibilidade de sessão
                    const dadosUsuario = {
                        nome: resposta.nome,
                        username: user,
                        tipo: resposta.tipo
                    };
                    localStorage.setItem('usuario_ativo', JSON.stringify(dadosUsuario));
                    sessionStorage.setItem('pbs_autorizado', 'true');
                    
                    if (resposta.tipo === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'cadastro.html';
                    }
                } else {
                    msgDiv.style.color = '#dc2626';
                    msgDiv.innerText = resposta.message || 'Usuário ou senha incorretos.';
                }
            })
            .catch(err => {
                msgDiv.style.color = '#dc2626';
                msgDiv.innerText = 'Erro de conexão com o servidor.';
            });
        }
    </script>
</body>
</html>
