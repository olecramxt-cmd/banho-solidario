<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMAS iPeC - Login / Banho Solidário</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0ea5e9;
            --secondary-color: #7c3aed;
            --accent-color: #e0f2fe;
            --dark-color: #1f2937;
            --light-color: #f8fafc;
            --text-color: #4b5563;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        .login-title { color: var(--secondary-color); font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .login-subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 20px; }
        
        .operator-avatar-box { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; border: 3px solid var(--secondary-color); display: flex; align-items: center; justify-content: center; background-color: #e2e8f0; margin: 0 auto 10px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .operator-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        #operatorNameDisplay { font-size: 0.95rem; font-weight: 600; color: var(--secondary-color); margin-bottom: 20px; min-height: 22px; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 0.9rem; color: var(--dark-color); }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; }
        .form-control:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }
        
        .forgot-password-link { text-align: center; margin-bottom: 20px; }
        .forgot-password-link a { font-size: 0.88rem; color: var(--secondary-color); text-decoration: none; font-weight: 500; }
        .forgot-password-link a:hover { text-decoration: underline; }

        .btn-login { background: var(--secondary-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        .btn-login:hover { background: #6d28d9; }
        #mensagemErro { color: #dc2626; font-size: 0.9rem; margin-top: 15px; font-weight: 500; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-card h3 { color: var(--secondary-color); margin-bottom: 15px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="login-title">SISTEMAS iPeC</h1>
        <p class="login-subtitle">Projeto Banho Solidário – Área Restrita</p>

        <div class="operator-avatar-box" id="avatarBox">
            <i class="fa-solid fa-user" style="font-size: 2.5rem; color: var(--secondary-color);"></i>
        </div>
        <div id="operatorNameDisplay"></div>

        <form onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label>Usuário (Username)</label>
                <input type="text" id="username" class="form-control" placeholder="Ex: marcelo" required oninput="buscarFotoOperadorRapido()">
            </div>
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="senha" class="form-control" placeholder="Digite sua senha..." required>
            </div>
            
            <div class="forgot-password-link">
                <a href="#" onclick="abrirModalSenha(event)">Esqueceu ou quer mudar a sua senha?</a>
            </div>

            <button type="submit" class="btn-login">Entrar no Sistema</button>
            <div id="mensagemErro"></div>
        </form>
    </div>

    <div class="modal-overlay" id="modalSenha">
        <div class="modal-card">
            <h3>Recuperar / Alterar Senha</h3>
            <form onsubmit="solicitarAlteracaoSenha(event)">
                <div class="form-group">
                    <label>Seu Usuário</label>
                    <input type="text" id="modalUser" class="form-control" placeholder="Digite seu usuário..." required>
                </div>
                <div class="form-group">
                    <label>Nova Senha Desejada</label>
                    <input type="password" id="modalNovaSenha" class="form-control" placeholder="Digite a nova senha..." required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn-login" style="padding: 10px;">Atualizar Senha</button>
                    <button type="button" class="btn-login" style="background: #64748b; padding: 10px;" onclick="fecharModalSenha()">Cancelar</button>
                </div>
                <div id="modalMensagem" style="font-size: 0.85rem; margin-top: 10px; text-align: center;"></div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = CONFIG.API_URL;

        function converterLinkDrive(url) {
            if (!url) return "";
            let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
            return url;
        }

        let timeoutBusca = null;
        function buscarFotoOperadorRapido() {
            clearTimeout(timeoutBusca);
            const user = document.getElementById('username').value.trim().toLowerCase();
            const avatarBox = document.getElementById('avatarBox');
            const nameDisplay = document.getElementById('operatorNameDisplay');

            if (!user) {
                avatarBox.innerHTML = `<i class="fa-solid fa-user" style="font-size: 2.5rem; color: var(--secondary-color);"></i>`;
                nameDisplay.innerText = "";
                return;
            }

            timeoutBusca = setTimeout(async () => {
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "buscarFoto", username: user })
                    });
                    
                    if (!res.ok) return;
                    const data = await res.json();
                    
                    if (data.status === "sucesso") {
                        if (data.foto) {
                            const fotoFinal = converterLinkDrive(data.foto);
                            avatarBox.innerHTML = `<img src="${fotoFinal}" alt="Operador" onerror="this.onerror=null;this.innerHTML='<i class=\'fa-solid fa-user\' style=\'font-size: 2.5rem; color: var(--secondary-color);\'></i>';">`;
                        } else {
                            avatarBox.innerHTML = `<i class="fa-solid fa-user" style="font-size: 2.5rem; color: var(--secondary-color);"></i>`;
                        }
                        nameDisplay.innerText = data.nome ? `Operador: ${data.nome}` : "";
                    } else {
                        avatarBox.innerHTML = `<i class="fa-solid fa-user" style="font-size: 2.5rem; color: var(--secondary-color);"></i>`;
                        nameDisplay.innerText = "";
                    }
                } catch (e) {
                    console.error("Busca de foto ignorada", e);
                }
            }, 350);
        }

        async function realizarLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('senha').value.trim();
            const erroDiv = document.getElementById('mensagemErro');

            erroDiv.style.color = "#0284c7";
            erroDiv.innerText = "A validar acesso na nuvem...";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "loginUsuario", username: user, senha: pass })
                });

                if (!res.ok) throw new Error("Erro HTTP: " + res.status);

                const resposta = await res.json();

                if (resposta.status === 'sucesso') {
                    localStorage.setItem('usuario_ativo', JSON.stringify(resposta.operador));
                    sessionStorage.setItem('pbs_autorizado', 'true');
                    
                    // Redireciona sempre de forma limpa para a tela de Atendimentos ou destino salvo válido
                    const destino = sessionStorage.getItem('pbs_destino') || 'atendimentos.html';
                    sessionStorage.removeItem('pbs_destino');
                    window.location.href = destino;
                } else {
                    erroDiv.style.color = "#dc2626";
                    erroDiv.innerText = resposta.message || "Utilizador ou senha inválidos!";
                }
            } catch (e) {
                erroDiv.style.color = "#dc2626";
                erroDiv.innerText = "Erro de conexão com a nuvem. Tente novamente.";
            }
        }

        function abrirModalSenha(e) {
            e.preventDefault();
            document.getElementById('modalSenha').style.display = 'flex';
        }

        function fecharModalSenha() {
            document.getElementById('modalSenha').style.display = 'none';
            document.getElementById('modalMensagem').innerText = "";
        }

        function solicitarAlteracaoSenha(e) {
            e.preventDefault();
            const user = document.getElementById('modalUser').value.trim().toLowerCase();
            const novaSenha = document.getElementById('modalNovaSenha').value.trim();
            const msgDiv = document.getElementById('modalMensagem');

            msgDiv.style.color = "#0ea5e9";
            msgDiv.innerText = "A atualizar palavra-passe...";

            fetch(API_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "atualizarSenha", username: user, novaSenha: novaSenha })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "sucesso") {
                    msgDiv.style.color = "green";
                    msgDiv.innerText = "Senha atualizada com sucesso!";
                    setTimeout(() => { fecharModalSenha(); }, 2000);
                } else {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = data.message || "Erro ao atualizar senha.";
                }
            })
            .catch(err => {
                msgDiv.style.color = "red";
                msgDiv.innerText = "Erro de conexão com o servidor.";
            });
        }
    </script>
</body>
</html>
