        .side-menu.active { right: 0; }
        .side-menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-color); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .side-menu-header h3 { color: var(--secondary-color); font-size: 1.2rem; margin: 0; }
        .close-menu { background: none; border: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer; }
        .side-menu-links { display: flex; flex-direction: column; gap: 0.8rem; }
        .menu-link-item { background: var(--light-color); color: var(--secondary-color); padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 10px; border-left: 4px solid var(--secondary-color); transition: all 0.3s; font-size: 0.95rem; }
        .menu-link-item:hover { background: var(--accent-color); transform: translateX(5px); }
        .side-menu-sublinks { padding-left: 18px; display: flex; flex-direction: column; gap: 0.4rem; }
        .menu-sublink-item { font-size: 0.88rem; color: var(--text-color); padding: 7px 10px; background: #f1f5f9; border-radius: 6px; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border-left: 3px solid transparent; }
        .menu-sublink-item:hover { background: var(--accent-color); color: var(--secondary-color); border-left-color: var(--secondary-color); }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: none; z-index: 999; }
        .menu-overlay.active { display: block; }

        .container { max-width: 900px; width: 100%; margin: 70px auto 30px auto; background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h2 { color: var(--secondary-color); font-size: 1.5rem; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; text-align: center; justify-content: center; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; font-size: 0.95rem; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 768px) {
            .form-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .form-group.full-width { grid-column: span 2; }
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; font-size: 0.9rem; color: var(--dark-color); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; background-color: #fff; color: var(--text-color); }
        .form-control:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }

        .cargos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 5px; }
        .cargos-grid label { font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; cursor: pointer; }

        .btn-atualizar { background: var(--secondary-color); color: white; border: none; padding: 14px 24px; border-radius: 8px; font-weight: 600; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; width: 100%; margin-top: 20px; }
        .btn-atualizar:hover { background: #6d28d9; }
        #mensagemStatus { text-align: center; margin-top: 15px; font-weight: 600; font-size: 0.95rem; }
    </style>
</head>
<body onload="inicializarPerfilVoluntario()">

    <script src="config.js"></script>
    <script>
        // Validação estrita de Sessão / Login de Voluntário ou Operador
        const autorizado = sessionStorage.getItem('pbs_autorizado') === 'true';
        let usuarioAtivo = {};
        try {
            usuarioAtivo = JSON.parse(localStorage.getItem('usuario_ativo') || '{}');
        } catch(e) { usuarioAtivo = {}; }

        if (!autorizado && !usuarioAtivo.username && !usuarioAtivo.email) {
            sessionStorage.setItem('pbs_destino', 'perfil_voluntario.html');
            window.location.href = 'login.html';
        }

        const API_URL = CONFIG.API_URL;
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>

    <div class="navbar-top">
        <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i> Menu</button>
        <span style="font-weight: bold; font-size: 16px;">SISTEMAS iPeC - Área do Voluntário</span>
    </div>

    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <h3>Menu do Sistema</h3>
            <button class="close-menu" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="side-menu-links">
            <a href="index.html" class="menu-link-item" style="border-left-color: #16a34a;"><i class="fa-solid fa-house"></i> Início (Página Inicial)</a>
            <div style="font-weight: 600; color: var(--secondary-color); font-size: 0.9rem; margin-top: 5px;">1. Voluntários</div>
            <div class="side-menu-sublinks">
                <a href="inscricao_voluntario.html" class="menu-sublink-item"><i class="fa-solid fa-user-plus"></i> 1.1- Inscrição</a>
                <a href="perfil_voluntario.html" class="menu-sublink-item" style="background: var(--accent-color); color: var(--secondary-color); font-weight: 600;"><i class="fa-solid fa-id-card"></i> 1.2- Meu Perfil</a>
            </div>
            <div style="font-weight: 600; color: var(--secondary-color); font-size: 0.9rem; margin-top: 5px;">2. Assistidos</div>
            <div class="side-menu-sublinks">
                <a href="galeria.html" class="menu-sublink-item"><i class="fa-solid fa-users"></i> 2.3- Galeria da Dignidade</a>
            </div>
            <a href="./ebook/" target="_blank" class="menu-link-item" style="margin-top: 5px;"><i class="fa-solid fa-book-open"></i> 5. Sobre</a>
        </div>
    </nav>

    <div class="container">
        <h2><i class="fa-solid fa-id-card-clip"></i> Gestão do Meu Perfil de Voluntário</h2>
        <p class="subtitle">Área restrita e exclusiva para consulta e atualização dos seus dados cadastrais e funções.</p>

        <form id="formPerfilVoluntario" onsubmit="atualizarPerfilVoluntario(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="volNome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Nome Social</label>
                    <input type="text" id="volNomeSocial" class="form-control">
                </div>
                <div class="form-group">
                    <label>CPF (Identificação Única)</label>
                    <input type="text" id="volCpf" class="form-control" readonly style="background-color: #f1f5f9;">
                </div>
                <div class="form-group">
                    <label>Telefone / WhatsApp *</label>
                    <input type="text" id="volTelefone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="volEmail" class="form-control">
                </div>
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" id="volNascimento" class="form-control">
                </div>
                <div class="form-group full-width">
                    <label>Endereço Residencial e Bairro *</label>
                    <input type="text" id="volEndereco" class="form-control" required>
                </div>
                <div class="form-group full-width">
                    <label>Cargos / Funções Pretendidas no Projeto</label>
                    <div class="cargos-grid">
                        <label><input type="checkbox" name="cargoVol" value="Higiene e Banho"> Higiene e Banho</label>
                        <label><input type="checkbox" name="cargoVol" value="Alimentação / Janta"> Alimentação / Janta</label>
                        <label><input type="checkbox" name="cargoVol" value="Curativos e Saúde"> Curativos e Saúde</label>
                        <label><input type="checkbox" name="cargoVol" value="Corte de Cabelo"> Corte de Cabelo</label>
                        <label><input type="checkbox" name="cargoVol" value="Recepção e Triagem"> Recepção e Triagem</label>
                        <label><input type="checkbox" name="cargoVol" value="Logística e Apoio Geral"> Logística e Apoio Geral</label>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Disponibilidade de Dias e Horários</label>
                    <input type="text" id="volDisponibilidade" class="form-control">
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn-atualizar"><i class="fa-solid fa-floppy-disk"></i> Salvar Alterações do Meu Perfil</button>
                </div>
            </div>
        </form>
        <div id="mensagemStatus"></div>
    </div>

    <script>
        function inicializarPerfilVoluntario() {
            const identificador = usuarioAtivo.username || usuarioAtivo.email || usuarioAtivo.cpf || "";
            if (!identificador) return;

            const statusDiv = document.getElementById('mensagemStatus');
            statusDiv.style.color = "#0284c7";
            statusDiv.innerText = "Carregando seus dados da nuvem...";

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "consultarVoluntario", termo: identificador })
            })
            .then(res => res.json())
            .then(data => {
                statusDiv.innerText = "";
                if (data.status === "encontrado" && data.registro) {
                    const reg = data.registro;
                    document.getElementById('volNome').value = reg.nome || "";
                    document.getElementById('volNomeSocial').value = reg.nomeSocial || "";
                    document.getElementById('volCpf').value = reg.cpf || "";
                    document.getElementById('volTelefone').value = reg.telefone || "";
                    document.getElementById('volEmail').value = reg.email || "";
                    document.getElementById('volNascimento').value = reg.nascimento || "";
                    document.getElementById('volEndereco').value = reg.endereco || "";
                    document.getElementById('volDisponibilidade').value = reg.disponibilidade || "";

                    if (reg.cargos) {
                        const cargosArr = reg.cargos.split(',').map(c => c.trim());
                        document.querySelectorAll('input[name="cargoVol"]').forEach(cb => {
                            if (cargosArr.includes(cb.value)) cb.checked = true;
                        });
                    }
                } else {
                    statusDiv.style.color = "orange";
                    statusDiv.innerText = "Nenhum cadastro de voluntário localizado para este usuário. Preencha os campos para salvar.";
                }
            })
            .catch(() => {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Erro ao carregar dados do perfil.";
            });
        }

        function atualizarPerfilVoluntario(e) {
            e.preventDefault();
            const cargosSelecionados = Array.from(document.querySelectorAll('input[name="cargoVol"]:checked')).map(cb => cb.value);

            const payload = {
                action: "atualizarVoluntario",
                nome: document.getElementById('volNome').value.trim(),
                nomeSocial: document.getElementById('volNomeSocial').value.trim(),
                cpf: document.getElementById('volCpf').value.trim(),
                telefone: document.getElementById('volTelefone').value.trim(),
                email: document.getElementById('volEmail').value.trim(),
                nascimento: document.getElementById('volNascimento').value,
                endereco: document.getElementById('volEndereco').value.trim(),
                cargos: cargosSelecionados.join(', '),
                disponibilidade: document.getElementById('volDisponibilidade').value.trim()
            };

            const statusDiv = document.getElementById('mensagemStatus');
            statusDiv.style.color = "#0284c7";
            statusDiv.innerText = "Atualizando dados na nuvem...";

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "sucesso") {
                    statusDiv.style.color = "green";
                    statusDiv.innerText = "Perfil atualizado com sucesso!";
                    setTimeout(() => { statusDiv.innerText = ""; }, 3000);
                } else {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = data.message || "Erro ao atualizar perfil.";
                }
            })
            .catch(() => {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Erro de conexão com o servidor.";
            });
        }
    </script>
</body>
</html>
